services:
  - type: web
    name: solabot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: RAG_CORPUS_DIR
        value: /app/corpus
      - key: CHROMA_PERSIST_DIRECTORY
        value: /app/corpus/indexes/chroma/alliance
      - key: RAG_CHUNKS_PATH
        value: /app/corpus/processed/chunks/alliance/all_chunks_for_embeddings.jsonl
      - key: CHROMA_COLLECTION_NAME
        value: solabot_alliance_v1
      - key: HF_HOME
        value: /app/.cache/huggingface
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-5.4-mini
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: solabot-production
