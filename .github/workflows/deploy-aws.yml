name: Deploy AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aws-ec2
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and restart Docker app
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://56.125.22.78:8000

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_KEY"

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/aia_ec2_key
          chmod 600 ~/.ssh/aia_ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload source to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          EC2_USER="${EC2_USER:-ubuntu}"
          APP_DIR="/home/$EC2_USER/aia"
          ARCHIVE_PATH="/tmp/aia-source.tar.gz"

          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='web/node_modules' \
            --exclude='web/dist' \
            --exclude='runtime_logs' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            -czf "$ARCHIVE_PATH" .

          scp -i ~/.ssh/aia_ec2_key "$ARCHIVE_PATH" "$EC2_USER@$EC2_HOST:/tmp/aia-source.tar.gz"

          ssh -i ~/.ssh/aia_ec2_key "$EC2_USER@$EC2_HOST" \
            "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p "$APP_DIR"
          find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name ".env" -exec rm -rf {} +
          tar -xzf /tmp/aia-source.tar.gz -C "$APP_DIR"
          rm -f /tmp/aia-source.tar.gz
          REMOTE

      - name: Sync production env
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          if [ -z "$PRODUCTION_ENV" ]; then
            echo "PRODUCTION_ENV is empty; keeping the .env file already present on EC2."
            exit 0
          fi

          EC2_USER="${EC2_USER:-ubuntu}"
          APP_DIR="/home/$EC2_USER/aia"

          printf '%s\n' "$PRODUCTION_ENV" > .env.production
          scp -i ~/.ssh/aia_ec2_key .env.production "$EC2_USER@$EC2_HOST:$APP_DIR/.env"

      - name: Rebuild and restart container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          EC2_USER="${EC2_USER:-ubuntu}"
          APP_DIR="/home/$EC2_USER/aia"

          ssh -i ~/.ssh/aia_ec2_key "$EC2_USER@$EC2_HOST" \
            "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$APP_DIR"
          test -f .env
          docker rm -f solabot 2>/dev/null || true
          docker compose down --remove-orphans || true
          docker compose up -d --build
          docker image prune -f
          docker compose ps
          REMOTE

      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          EC2_USER="${EC2_USER:-ubuntu}"

          ssh -i ~/.ssh/aia_ec2_key "$EC2_USER@$EC2_HOST" \
            "bash -s" <<'REMOTE'
          set -euo pipefail

          for attempt in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            echo "Health check ainda indisponível; tentativa ${attempt}/12."
            sleep 5
          done

          echo "Health check falhou após 60s. Estado dos containers:"
          docker compose ps || true
          echo "Logs recentes do container:"
          docker compose logs --tail=120 aia || true
          exit 1
          REMOTE
