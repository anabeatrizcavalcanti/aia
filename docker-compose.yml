services:
  solabot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      RAG_CORPUS_DIR: /app/storage/corpus
      CHROMA_PERSIST_DIRECTORY: /app/storage/corpus/indexes/chroma/alliance
      RAG_CHUNKS_PATH: /app/storage/corpus/processed/chunks/alliance/all_chunks_for_embeddings.jsonl
      HF_HOME: /app/storage/huggingface
      RERANKER_ENABLED: "true"
      RERANKER_MODEL: cross-encoder/ms-marco-TinyBERT-L2-v2
      RERANKED_TOP_K: "12"
      HYBRID_CANDIDATE_K: "16"
      RERANKER_MAX_TEXT_CHARS: "1800"
    volumes:
      - ./corpus:/app/storage/corpus
